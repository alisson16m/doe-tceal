name: Processar Diário Oficial TCE/AL

on:
  schedule:
    # Roda às 07h00 BRT (= 10h00 UTC) de segunda a sexta
    - cron: '0 10 * * 1-5'
  workflow_dispatch:
    # Permite rodar manualmente pelo painel do GitHub (útil para testes)

permissions:
  contents: write

jobs:
  processar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m scripts.main

      - name: Salvar alterações no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: atualiza diário $(date +%Y-%m-%d)"
          git push
