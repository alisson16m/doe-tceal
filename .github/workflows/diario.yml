name: Processar Diário Oficial TCE/AL

on:
  schedule:
    # Roda às 07h00 BRT (= 10h00 UTC) de segunda a sexta
    - cron: '0 10 * * 1-5'
  workflow_dispatch:
    inputs:
      data_edicao:
        description: 'Data da edição a processar (ex: 02/06/2026). Deixe vazio para processar a próxima nova.'
        required: false
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  processar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INPUT_DATA_EDICAO: ${{ github.event.inputs.data_edicao }}
        run: python -m scripts.main

      - name: Salvar alterações no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: atualiza diário $(date +%Y-%m-%d)"
          git push
