<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOE TCE/AL — Monitor de Publicações</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f5f5; color: #222; line-height: 1.6; }
    header { background: #1a3a5c; color: #fff; padding: 1.5rem 2rem; }
    header h1 { font-size: 1.3rem; font-weight: 700; }
    header p { font-size: 0.9rem; opacity: 0.8; margin-top: 0.25rem; }
    main { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    .vazio { text-align: center; padding: 3rem; color: #888; background: #fff; border-radius: 8px; }
    .grid { display: grid; gap: 1rem; }
    .card { background: #fff; border-radius: 8px; border: 1px solid #ddd; padding: 1.25rem; text-decoration: none; color: inherit; display: block; transition: box-shadow 0.15s; }
    .card:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
    .card-data { font-size: 0.8rem; color: #888; margin-bottom: 0.4rem; }
    .card-resumo { font-size: 0.95rem; color: #333; margin-bottom: 0.75rem; }
    .badges { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .badge { font-size: 0.75rem; padding: 0.2rem 0.6rem; border-radius: 12px; font-weight: 600; }
    .badge-normativos { background: #dde8f5; color: #1a3a5c; }
    .badge-decisoes { background: #dff0df; color: #2d6a2d; }
    .badge-atos { background: #faebd7; color: #7a4000; }
    footer { text-align: center; padding: 2rem; font-size: 0.8rem; color: #888; }
    @media (max-width: 600px) { header { padding: 1rem; } }
  </style>
</head>
<body>
  <header>
    <h1>Diário Oficial Eletrônico — TCE/AL</h1>
    <p>Monitor automático de publicações</p>
  </header>
  <main>
    
    <div class="vazio">
      <p>Nenhuma edição processada ainda.</p>
      <p>O pipeline roda automaticamente toda manhã.</p>
    </div>
    
  </main>
  <footer>Atualizado automaticamente via GitHub Actions</footer>
</body>
</html>
